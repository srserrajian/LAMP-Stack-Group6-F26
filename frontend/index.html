<!DOCTYPE html>
<html lang = "en" data-bs-theme = "dark">
<head>
    <meta charset = "UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Manager - Log In</title>
    <!--Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!--Custom Styles-->
    <link href="css/styles.css" rel="stylesheet">
    <!--Scripts-->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">
    <div class="background-glow"></div>
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                <!--Title-->
                <div class="text-center mb-4">
                    <div class="app-icon-wrapper mb-3 mx-auto">
                        <i class="bi bi-journal"></i>
                    </div>
                    <h1 id="title" class="fw-bold tracking-tight">Contact Manager</h1>
                </div>

                <!--Login Form-->
                <div id="loginFormContainer" class="card glass-card shadow-lg p-4 p-sm-5">
                    <div class="card-body p-0">
                        <span id="inner-title" class="d-block text-center fw-semibold mb-4 fs-5">Log In</span>

                        <form id="loginForm" class="needs-validation">
                            <!--Username-->
                            <div class="mb-3">
                                <label for="loginUsername" class="form-label form-label-contrast small">Username</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" id="loginUsername" class="form-control" placeholder="Enter username" required />
                                </div>
                            </div>

                            <!--Password-->
                            <div class="mb-4">
                                <label for="loginPassword" class="form-label form-label-contrast small">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" id="loginPassword" class="form-control" placeholder="Enter password" required />
                                </div>
                            </div>

                            <!-- Login Failed -->
                            <div class="mt-1 text-center">
                                <p id="loginError" class="text-danger small mt-1 d-none"></p>
                            </div>

                            <!-- Login Success -->
                             <div class="mt-1 text-center">
                                <p id="loginSuccess" class="text-success small mt-1 d-none"></p>
                             </div>

                            <!-- Login Button -->
                            <button type="submit" id="loginBtn" class="buttons btn btn-primary w-100 py-3 fw-semibold rounded-3 d-flex align-items-center justify-content-center gap-2">
                                <span>Log In</span>
                                <i class="bi bi-arrow-right"></i>
                            </button>
                        </form>
                    </div>

                     <!--Register Link-->
                    <div class="mt-2 text-center" style="color: rgba(48, 119, 102);">
                        Don't have an account?
                        <a href="register.html">Register</a>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
