<!DOCTYPE html>
<html lang = "en" data-bs-theme = "dark">
<head>
    <meta charset = "UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Manager - Register</title>
    <!--Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!--Custom Styles-->
    <link href="css/styles.css" rel="stylesheet">
    <!--Scripts-->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">
    <div class="background-glow"></div>
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">

                <!--Title-->
                <div class="text-center mb-4">
                    <div class="app-icon-wrapper mb-3 mx-auto">
                        <i class="bi bi-journal"></i>
                    </div>
                    <h1 id="title" class="fw-bold tracking-tight">Contact Manager</h1>
                </div>

                <!-- Register Form -->
                <div id="registerFormContainer" class="card glass-card shadow-lg p-4 p-sm-5">
                    <div class="card-body p-0">
                        <span id="inner-title" class="d-block text-center fw-semibold tracking-wider mb-4 fs-5">Register</span>

                        <form id="registerForm" class="needs-validation">
                            <div class="row">
                                <!-- Add First Name -->
                                <div class="mb-3 col-6">
                                    <label for="registerFirstName" class="form-label form-label-contrast small">First Name</label>
                                    <div class="input-group">
                                        <input type="text" id="registerFirstName" class="form-control" placeholder="First name" required />
                                    </div>
                                </div>

                                <!-- Add Last Name -->
                                <div class="mb-3 col-6">
                                    <label for="registerLastName" class="form-label form-label-contrast small mb-2">Last Name</label>
                                    <div class="input-group">
                                        <input type="text" id="registerLastName" class="form-control" placeholder="Last name" required>
                                    </div>
                                </div>
                                </div>

                            <!-- Input Email -->
                            <div class="mb-3"> 
                                <label for="registerEmail" class="form-label form-label-contrast small mb-2">Email</label>
                                <div class="input-group">
                                    <input type="email" id="registerEmail" class="form-control" placeholder="you@example.com" required>
                                </div>
                            </div>

                            <!-- Create Username -->
                            <div class="mb-3">
                                <label for="registerName" class="form-label form-label-contrast small">Username</label>
                                <div class="input-group">
                                    <input type="text" id="registerName" class="form-control" placeholder="Create username" required />
                                </div>
                            </div>

                            <!--Create Password-->
                            <div class="mb-4">
                                <label for="registerPassword" class="form-label form-label-contrast small">Password</label>
                                <div class="input-group">
                                    <input type="password" id="registerPassword" class="form-control" placeholder="Create password" required />
                                </div>
                            </div>

                            <!-- Register Button -->
                            <button type="submit" id="registerBtn" class="buttons btn btn-primary w-100 py-3 fw-semibold rounded-3 d-flex align-items-center justify-content-center gap-2">
                                <span>Sign Up</span>
                                <i class="bi bi-arrow-right"></i>
                            </button>
                        </form>

                        <!-- Register Error -->
                        <div class="mt-3 text-center">
                            <p id="registerError" class="text-danger small mt-1 mb-3 d-none"></p>
                        </div>

                        <!-- Register Success -->
                        <div class="mt-3 text-center">
                            <p id="registerSuccess" class="text-success small mt-1 mb-3 d-none"></p>
                        </div>
                    </div>

                     <!--Log In Link-->
                    <div class="mt-2 text-center" style="color: rgba(48, 119, 102);">
                        Already have an account?
                        <a href="index.html">Log in</a>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
