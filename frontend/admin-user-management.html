<!DOCTYPE html>
<html lang = "en" data-bs-theme = "dark">
<head>
    <meta charset = "UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users - Contact Manager</title>
    <!--Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!--Custom Styles-->
    <link href="css/styles.css" rel="stylesheet">
    <!--Scripts-->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/contacts.js"></script>
</head>
<body class="align-items-center justify-content-center min-vh-100 py-5" data-page="admin-users">
    <div class="background-glow"></div>
    <main class="container">
        <h2 class="fw-bold mb-4 d-flex align-items-center gap-2">User Management</h2>
        <div class="header rounded-pill shadow">
            <div class="d-flex flex-wrap">
                <!-- Search Contact Bar -->
                <div class="my-auto me-4 ms-3 flex-grow-1">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" id="searchInput" class="form-control" placeholder="Enter user" />
                        <button type="button" id="searchContactBtn" class="btn btn-primary px-4 fw-semibold">
                            Search User
                        </button>
                    </div>
                </div>
                <!-- Back to Home Button -->
                <button type="button" id="backToHomeBtn" class="btn btn-primary rounded-pill my-3 me-3 ms-auto">
                    <i class="bi bi-house"></i> Back to Home
                </button>
                <!-- Add Contact Button -->
                <button type="button" id="addContactBtn" class="btn btn-primary rounded-pill my-3 me-3 ms-auto">
                    <i class="bi bi-plus-circle"></i> Create Admin
                </button>
                <!-- Log Out Button -->
                <button type="button" id="logoutBtn" class="logout-btn btn btn-outline-danger rounded-pill my-3 me-3 ms-auto">
                    Log Out <i class="bi bi-box-arrow-right me-1"></i>
                </button>
            </div>
        </div>
        <!-- Create Admin -->
        <div id="adminModal" class="my-3" style="display: none;">
            <div class="modal-content shadow">
                <h3 id="adminModalTitle" class="text-center my-3 fw-bold">Create Admin Account</h3>
                <form id="adminForm">
                    <p id="adminError" class="text-danger small d-none"></p>
                    <div class="row justify-content-center gx-4 gy-3">
                        <!-- New Admin First Name, Last Name -->
                        <div class="col-sm-4">
                            <label for="newAdminFirstName" class="form-label form-label-contrast small fw-semibold">First Name</label>
                            <input type="text" id="newAdminFirstName" class="form-control" required>
                        </div>

                        <div class="col-sm-4">
                            <label for="newAdminLastName" class="form-label form-label-contrast small fw-semibold">Last Name</label>
                            <input type="text" id="newAdminLastName" class="form-control" required>
                        </div>

                        <!-- New Admin Email -->
                        <div class="col-sm-8">
                            <label for="newAdminEmail" class="form-label form-label-contrast small fw-semibold">Email</label>
                            <input type="email" id="newAdminEmail" class="form-control" required>
                        </div>

                        <!-- New Admin Username -->
                        <div class="col-sm-8">
                            <label for="newAdminUsername" class="form-label form-label-contrast small fw-semibold">Username</label>
                            <input type="text" id="newAdminUsername" class="form-control" required>
                        </div>
                    
                        <!-- New Admin Password -->
                        <div class="col-sm-8">
                            <label for="newAdminPassword" class="form-label form-label-contrast small fw-semibold">Password</label>
                            <input type="password" id="newAdminPassword" class="form-control" required>
                        </div>
                    </div>
                    <div class="text-center">
                        <!-- Cancel, Create Admin Buttons-->
                        <button type="button" id="cancelAdminBtn" class="btn cancel-btn btn-primary my-3 ms-3">Cancel</button>
                        <button type="submit" id="submitAdminBtn" class="btn btn-primary">Create Admin</button>
                    </div>
                </form>
            </div>
        </div>
        <!-- Change Password -->
        <div id="changePasswordModal" class="my-3" style="display: none;">
            <div class="modal-content shadow">
                <h3 id="changePasswordModalTitle" class="text-center my-3 fw-bold">Change Password</h3>
                <form id="changePasswordForm">
                    <p id="changePasswordError" class="text-danger small d-none"></p>
                    <div class="row justify-content-center gx-4 gy-3">
                        <!-- Input New Password -->
                        <div class="col-sm-6">
                            <label for="inputNewPassword" class="form-label form-label-contrast small fw-semibold">Input New Password</label>
                            <input type="password" id="inputNewPassword" class="form-control" required>
                        </div>
                    </div>
                    <div class="text-center">
                        <!-- Cancel, Change Password Buttons-->
                        <button type="button" id="cancelPasswordBtn" class="btn cancel-btn btn-primary my-3 ms-3">Cancel</button>
                        <button type="submit" id="submitPasswordBtn" class="btn btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>
        <h3 class="mt-3 mb-1">Users</h3>
        <div class="users-list p-3 shadow">
            <div id="usersListContainer">
                <table class="table mb-0">
                    <thead>
                        <tr class="text-secondary small fw-semibold">
                            <th>Username</th>
                            <th>Admin</th>
                            <th>Status</th>
                            <th class="actions-header">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
